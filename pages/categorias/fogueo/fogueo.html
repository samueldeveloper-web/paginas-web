<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

      name="description"
      content="Categoria TREX de fogueo con visual comercial y acceso al carrito."

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Hanken+Grotesk:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/pages/categorias/fogueo/fogueo.css" />
  </head>
  <body data-page="public" data-category-slug="fogueo">
    <div class="site-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <img class="brand-logo" src="/assets/img/branding/logotrex.jpeg" alt="Logo TREX" />
          <div>
            <p class="eyebrow">Armas deportivas</p>
            <a class="brand-name" href="/index.html">TREX</a>
          </div>
        </div>

        <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
          <span></span>
          <span></span>
        </button>

        <nav class="main-nav">
          <a href="/index.html#categorias">Categorias</a>
          <a href="/index.html#destacados">Destacados</a>
          <a href="/index.html#beneficios">Beneficios</a>
          <a href="/index.html#contacto">Contacto</a>
          <a href="/pages/admin/admin.html">Admin</a>
        </nav>

        <a class="cta-chip" href="/index.html">Volver al inicio</a>

        <a class="cart-trigger" href="/pages/carrito/carrito.html" aria-label="Ir al carrito de compras">

          <span>Carrito</span>
          <span class="cart-count" id="cart-count">0</span>
        </a>
      </header>

      <main class="cart-page">
        <section class="cart-hero">
          <div>
            <p class="eyebrow" id="category-tag">Categoria TREX</p>
            <h1 id="category-title">Fogueo</h1>
            <p class="hero-text" id="category-description">

            </p>
          </div>
          <a class="btn btn-secondary" href="/index.html#categorias">Ver mas categorias</a>
        </section>

        <section class="featured-products">
          <div class="section-heading">
            <p class="eyebrow">Seleccion</p>
            <h2 id="category-heading">Productos de fogueo disponibles en TREX.</h2>
          </div>
          <div class="product-grid" id="category-product-grid"></div>
        </section>
      </main>

    <script src="/shared/js/app-config.js"></script>
    <script type="module" src="/pages/categorias/fogueo/fogueo.js"></script>
